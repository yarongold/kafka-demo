apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: kafka-demo
  labels:
    app: consumer
  annotations:
    # Resolves bare `image: consumer:latest` against the in-namespace ImageStream
    # (which has lookupPolicy.local=true) at admission time, so OpenShift rewrites
    # it to the internal registry URL. Without this, kubelet treats the bare name
    # as a Docker Hub reference and ImagePullBackOffs.
    alpha.image.policy.openshift.io/resolve-names: "*"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: consumer:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: demo-kafka-kafka-bootstrap:9092
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
